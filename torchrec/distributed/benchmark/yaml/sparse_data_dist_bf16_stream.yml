# heavy dense workload, so the DDP gradient allreduce is worth compressing
# set allreduce_comm_precision to "bf16" to compare against the stock hook
RunOptions:
  world_size: 2
  num_batches: 10
  num_benchmarks: 1
  num_profiles: 1
  sharding_type: table_wise
  profile_dir: "."
  name: "sparse_data_dist_bf16_stream"
  loglevel: "info"
PipelineConfig:
  pipeline: "sparse"
  kwargs:
    site_fqn: "sparse.weighted_ebc"
    sharding_type: "table_wise"
ModelInputConfig:
  num_float_features: 100
  feature_pooling_avg: 30
ModelSelectionConfig:
  model_name: "test_sparse_nn"
  model_config:
    num_float_features: 100
    submodule_kwargs:
      dense_arch_out_size: 128
      over_arch_out_size: 4096
      over_arch_hidden_layers: 10
      dense_arch_hidden_sizes: [2048, 2048, 2048, 2048]
      skip_regroup: true
EmbeddingTablesConfig:
  num_unweighted_features: 90
  num_weighted_features: 80
  embedding_feature_dim: 256
PlannerConfig:
  pooling_factors: [30.0]  # Must match ModelInputConfig.feature_pooling_avg
ShardingConfig:
  allreduce_comm_precision: "bf16_stream"
