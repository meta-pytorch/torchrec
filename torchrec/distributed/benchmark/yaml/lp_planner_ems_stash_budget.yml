# LP planner + EMS stash budget benchmark config.
#
# Based on sparse_data_dist_emb_stash.yml, which exercises the EMS *runtime*
# (weights moved HBM->CPU after the dense forward) but plans with the OSS
# EmbeddingShardingPlanner. This config switches to the fb LinearProgrammingPlanner
# so the planner-side EMS path runs too:
#
#   stash_hbm_budget_gb unset -> awareness + BALANCE_MAX_STASH balance stage
#                                (stash every flagged table, flatten per-rank volume)
#   stash_hbm_budget_gb set   -> dual resident/stashed variants + budget-selection
#                                stage (stash a subset under a per-rank cap)
#
# The budget below is deliberately binding: with stash_weights on ~170 tables at
# dim 256 there is far more than 2 GB/rank of stashable weight, so the solver must
# select a strict subset. Note the budget path does NOT blanket-reduce -- unselected
# tables stay resident -- so the model must fit HBM with only `budget` GB/rank of
# relief. Raise the budget (or shrink the tables) if the planner reports infeasible.
#
# This file defaults to the NO-budget path (awareness + balance) so the A/B is a
# single added flag. Do not set stash_hbm_budget_gb to 0 to mean "off": the planner
# branches on `is None` while the solver branches on `> 0`, so 0 builds dual variants
# with no budget stage. Omit the flag instead.
#
# Usage (baseline vs budget A/B on the same config):
#   buck2 run @fbcode//mode/opt \
#     fbcode//torchrec/distributed/benchmark:benchmark_train_pipeline -- \
#     --yaml_config=fbcode/torchrec/distributed/benchmark/yaml/lp_planner_ems_stash_budget.yml \
#     --name=lp_ems_no_budget
#   ... same, plus --stash_hbm_budget_gb=2.0 --name=lp_ems_budget_2gb
#
# Log lines that confirm the path actually engaged:
#   "[Stash Awareness] Reflected EMS stashing in storage estimates: moved N GB"
#   "[Stash Budget] Budget=N GB/rank; built M stashed variants"
#   "[Stash Budget] Selected N/M tables to stash under budget"
#   "[Stash Budget] runtime stash set restricted to N planner-selected tables"
RunOptions:
  world_size: 2
  num_batches: 10
  num_benchmarks: 1
  num_profiles: 1
  sharding_type: table_wise
  profile_dir: "."
  name: "lp_planner_ems_stash_budget"
  memory_snapshot: True
  loglevel: "info"
PipelineConfig:
  pipeline: "sparse-emb-stash"
  kwargs:
    site_fqn: "over.overarch.0"  # dense
    delay_stash: true
    stash_site_fqn: "dense"
ModelInputConfig:
  num_float_features: 100
  feature_pooling_avg: 30
ModelSelectionConfig:
  model_name: "test_sparse_nn"
  model_config:
    num_float_features: 100
    submodule_kwargs:
      dense_arch_out_size: 128
      over_arch_out_size: 1024
      over_arch_hidden_layers: 5
      dense_arch_hidden_sizes: [128, 128, 128]
      skip_regroup: true
EmbeddingTablesConfig:
  num_unweighted_features: 90
  num_weighted_features: 80
  embedding_feature_dim: 256
  stash_weights: true
  additional_tables:
    - - name: FP16_table
        embedding_dim: 512
        num_embeddings: 100_000
        feature_names: ["additional_0_0"]
        data_type: FP16
      - name: large_table
        embedding_dim: 2048
        num_embeddings: 1_000_000
        feature_names: ["additional_0_1"]
      # Unflagged on purpose: the budget stage must never select it, and it must
      # land in a different TBE group from the flagged tables (stash_weights is
      # part of the TBE grouping key).
      - name: large_table_no_stash
        embedding_dim: 2048
        num_embeddings: 1_000_000
        feature_names: ["additional_0_2"]
        stash_weights: false
    - []
    - - name: skipped_table
        embedding_dim: 128
        num_embeddings: 100_000
        feature_names: ["additional_2_1"]
PlannerConfig:
  planner_type: "lp"
  pooling_factors: [30.0]  # Must match ModelInputConfig.feature_pooling_avg
  # stash_hbm_budget_gb intentionally unset here -- pass --stash_hbm_budget_gb=2.0
  # on the command line for the budget arm of the A/B (see the header).
  additional_constraints:
    large_table:
      sharding_types: [column_wise]
    large_table_no_stash:
      sharding_types: [column_wise]
