# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Push Binary Release

on:
  workflow_call:
    secrets:
      PYPI_TOKEN:
        required: false
  workflow_dispatch:


jobs:

  # build on cpu hosts and push to pypi
  build_on_cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      # a failure on one python version should not cancel the others
      fail-fast: false
      matrix:
        os:
          - linux.2xlarge
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        cuda-tag:
          - "cu126"
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Check ldd --version
        run: ldd --version
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update pip
        run: |
          sudo yum update -y
          sudo yum -y install git python3-pip
      - name: Setup conda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O ~/miniconda.sh
          bash ~/miniconda.sh -b -p $HOME/miniconda -u
      - name: setup Path
        run: |
          echo "/home/ec2-user/miniconda/bin" >> $GITHUB_PATH
          echo "CONDA=/home/ec2-user/miniconda" >> $GITHUB_PATH
      - name: create conda env
        run: |
          if [[ "${{ matrix.free-threaded }}" == "true" ]]; then
            conda create --name build_binary python-freethreading=${{ matrix.python-version }}
          else
            conda create --name build_binary python=${{ matrix.python-version }}
          fi
          conda info
      - name: check python version no Conda
        run: |
          python --version
      - name: check python version
        run: |
          conda run -n build_binary python --version
      - name: Install C/C++ compilers
        run: |
          sudo yum install -y gcc gcc-c++
      - name: Install PyTorch and CUDA
        shell: bash
        run: |
          conda run -n build_binary pip install torch==2.13
      - name: Install fbgemm
        shell: bash
        run: |
          conda run -n build_binary pip install numpy
          conda run -n build_binary pip install fbgemm-gpu==1.8
      - name: Install Dependencies
        shell: bash
        run: |
          conda run -n build_binary python -m pip install -r requirements.txt
      - name: Test Installation of dependencies
        run: |
          conda run -n build_binary python -c "import torch.distributed"
          echo "torch.distributed succeeded"
          conda run -n build_binary python -c "import skbuild"
          echo "skbuild succeeded"
          conda run -n build_binary python -c "import numpy"
          echo "numpy succeeded"
      # for the conda run with quotes, we have to use "\" and double quotes
      # here is the issue: https://github.com/conda/conda/issues/10972
      - name: Build TorchRec
        env:
          OFFICIAL_RELEASE: 1
        run: |
          rm -r dist || true
          python_tag="py$(echo '${{ matrix.python-version }}' | tr -d '.')"
          conda run -n build_binary \
            python setup.py bdist_wheel \
            --python-tag="${python_tag}"
      - name: Upload wheel as GHA artifact
        uses: actions/upload-artifact@v4
        with:
          name: torchrec_${{ matrix.python-version }}${{ matrix.free-threaded == true && 't' || '' }}_${{ matrix.cuda-tag }}.whl
          path: dist/torchrec-*.whl
      # Push to Pypi
      - name: Push TorchRec Binary to PYPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          conda run -n build_binary python -m pip install twine
          conda run -n build_binary \
            python -m twine upload \
              --username __token__ \
              --password "$PYPI_TOKEN" \
              --skip-existing \
              dist/torchrec-*.whl
