# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Push Binary Release

on:
  workflow_call:
    secrets:
      PYPI_TOKEN:
        required: false
  workflow_dispatch:


jobs:

  # build on cpu hosts and upload to GHA
  build_on_cpu:
    runs-on: ${{ matrix.os }}
    # OSDC runners have no host toolchain: the job runs in this image, which
    # already has conda, gcc and git.
    container:
      image: pytorch/almalinux-builder:cpu
    strategy:
      matrix:
        include:
          - os: mt-l-x86iavx512-8-64
            python-version: '3.10'
            python-tag: "py310"
            cuda-tag: "cu126"
          - os: mt-l-x86iavx512-8-64
            python-version: '3.11'
            python-tag: "py311"
            cuda-tag: "cu126"
          - os: mt-l-x86iavx512-8-64
            python-version: '3.12'
            python-tag: "py312"
            cuda-tag: "cu126"
          - os: mt-l-x86iavx512-8-64
            python-version: '3.13'
            python-tag: "py313"
            cuda-tag: "cu126"
          - os: mt-l-x86iavx512-8-64
            python-version: '3.14'
            python-tag: "py314"
            cuda-tag: "cu126"
          - os: mt-l-x86iavx512-8-64
            python-version: '3.15'
            python-tag: "py315"
            cuda-tag: "cu126"
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Check ldd --version
        run: ldd --version
      - name: Checkout
        uses: actions/checkout@v4
      - name: create conda env
        run: |
          if [[ "${{ matrix.python-version }}" == "3.15" ]]; then
            conda create --name build_binary --override-channels -c conda-forge/label/python_rc -c conda-forge python=${{ matrix.python-version }}
          else
            conda create --name build_binary python=${{ matrix.python-version }}
          fi
          conda info
      - name: check python version no Conda
        run: |
          python --version
      - name: check python version
        run: |
          conda run -n build_binary python --version
      - name: Install PyTorch and CUDA
        shell: bash
        run: |
          conda run -n build_binary pip install torch
      - name: Install fbgemm
        shell: bash
        run: |
          conda run -n build_binary pip install numpy
          conda run -n build_binary pip install fbgemm-gpu
      - name: Install Dependencies
        shell: bash
        run: |
          conda run -n build_binary python -m pip install -r requirements.txt
      - name: Test Installation of dependencies
        run: |
          conda run -n build_binary python -c "import torch.distributed"
          echo "torch.distributed succeeded"
          conda run -n build_binary python -c "import skbuild"
          echo "skbuild succeeded"
          conda run -n build_binary python -c "import numpy"
          echo "numpy succeeded"
      # for the conda run with quotes, we have to use "\" and double quotes
      # here is the issue: https://github.com/conda/conda/issues/10972
      - name: Build TorchRec
        env:
          OFFICIAL_RELEASE: 1
        run: |
          rm -r dist || true
          conda run -n build_binary \
            python setup.py bdist_wheel \
            --python-tag=${{ matrix.python-tag }}
      - name: Upload wheel as GHA artifact
        uses: actions/upload-artifact@v4
        with:
          name: torchrec_${{ matrix.python-version }}_${{ matrix.cuda-tag }}.whl
          path: dist/torchrec-*.whl

  # download from GHA, sanity check on gpu and push to pypi
  sanity_check_on_gpu_and_push:
    runs-on: ${{ matrix.os }}
    # Same image as the build; the OSDC GPU label exposes the GPU to it.
    container:
      image: pytorch/almalinux-builder:cpu
      options: --gpus all
    strategy:
      matrix:
        os:
          - mt-l-x86aavx2-11-41-a10g
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        cuda-tag:
          - "cu126"
    needs: build_on_cpu
    # the glibc version should match the version of the one we used to build the binary
    steps:
      - name: Check ldd --version
        run: ldd --version
      - name: check cpu info
        shell: bash
        run: |
          cat /proc/cpuinfo
      - name: check distribution info
        shell: bash
        run: |
          cat /proc/version
      - name: check gpu info
        shell: bash
        run: |
          nvidia-smi
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v4
      - name: create conda env
        run: |
          if [[ "${{ matrix.python-version }}" == "3.15" ]]; then
            conda create --name build_binary --override-channels -c conda-forge/label/python_rc -c conda-forge python=${{ matrix.python-version }}
          else
            conda create --name build_binary python=${{ matrix.python-version }}
          fi
          conda info
      - name: check python version no Conda
        run: |
          python --version
      - name: check python version
        run: |
          conda run -n build_binary python --version
      - name: Install PyTorch and CUDA
        shell: bash
        run: |
          conda run -n build_binary pip install torch
      # download wheel from GHA
      - name: Install fbgemm
        shell: bash
        run: |
          conda run -n build_binary pip install numpy
          conda run -n build_binary pip install fbgemm-gpu
      - name: Install torchmetrics
        shell: bash
        run: |
          conda run -n build_binary pip install torchmetrics==1.0.3
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: torchrec_${{ matrix.python-version }}_${{ matrix.cuda-tag }}.whl
      - name: Display structure of downloaded files
        run: ls -R
      - name: Install TorchRec
        run: |
          rm -r dist || true
          conda run -n build_binary python -m pip install *.whl
      - name: Test fbgemm_gpu and torchrec installation
        shell: bash
        run: |
          conda run -n build_binary \
            python -c "import fbgemm_gpu"
          conda run -n build_binary \
            python -c "import torchrec"
      # Push to Pypi
      - name: Push TorchRec Binary to PYPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          conda run -n build_binary python -m pip install twine
          conda run -n build_binary \
            python -m twine upload \
              --username __token__ \
              --password "$PYPI_TOKEN" \
              --skip-existing \
              torchrec-*.whl
